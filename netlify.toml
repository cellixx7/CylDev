[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Segurança. A CSP está só em modo Report-Only: violações aparecem no console, nada é bloqueado.
# 'unsafe-inline' em script (script de tema nos HTML) e estilo (style de React): endurecer depois, com hash.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.emailjs.com; object-src 'none'; base-uri 'self'; form-action 'self'"

# Endereços antigos de /negocios/ agora vivem na raiz.
[[redirects]]
  from = "/negocios/como-funciona/*"
  to = "/como-funciona/:splat"
  status = 301

[[redirects]]
  from = "/negocios/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/negocios"
  to = "/"
  status = 301
