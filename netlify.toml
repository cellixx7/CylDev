[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Endereços antigos de /negocios/ agora vivem na raiz.
[[redirects]]
  from = "/negocios/como-funciona/*"
  to = "/como-funciona/:splat"
  status = 301

[[redirects]]
  from = "/negocios/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/negocios"
  to = "/"
  status = 301
