[build]
  command = "npm run build"
  publish = "dist"
  # Economia de créditos: só a produção (branch main) é construída. Código de saída 0 = a Netlify pula o build.
  # Deploy preview (PR) e branch deploy (develop, commit_*) ficam de fora; o GitHub Actions já testa tudo.
  # Ver docs/decisoes/fluxo-de-branches.md.
  ignore = '[ "$CONTEXT" != "production" ]'

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fontes e imagens OG não levam hash, mas o nome muda quando o arquivo muda (ver CLAUDE.md): cache longo.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Segurança. A CSP está só em modo Report-Only: violações aparecem no console, nada é bloqueado.
# 'unsafe-inline' em script (script de tema nos HTML) e estilo (style de React): endurecer depois, com hash.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.emailjs.com; object-src 'none'; base-uri 'self'; form-action 'self'"

# Endereços antigos de /negocios/ agora vivem na raiz.
[[redirects]]
  from = "/negocios/como-funciona/*"
  to = "/como-funciona/:splat"
  status = 301

[[redirects]]
  from = "/negocios/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/negocios"
  to = "/"
  status = 301

# Página 404 de cada idioma (o 404.html da raiz é o do português). Idioma ainda não publicado cai no 404 padrão.
[[redirects]]
  from = "/en/*"
  to = "/en/404.html"
  status = 404
[[redirects]]
  from = "/es/*"
  to = "/es/404.html"
  status = 404
[[redirects]]
  from = "/fr/*"
  to = "/fr/404.html"
  status = 404
[[redirects]]
  from = "/zh/*"
  to = "/zh/404.html"
  status = 404
[[redirects]]
  from = "/hi/*"
  to = "/hi/404.html"
  status = 404
[[redirects]]
  from = "/ar/*"
  to = "/ar/404.html"
  status = 404
[[redirects]]
  from = "/bn/*"
  to = "/bn/404.html"
  status = 404
[[redirects]]
  from = "/ru/*"
  to = "/ru/404.html"
  status = 404
[[redirects]]
  from = "/ur/*"
  to = "/ur/404.html"
  status = 404
